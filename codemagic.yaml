workflows:
  android-workflow:
    name: Android Build & Package
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set up Keystores (Debug & Release)
        script: |
          # Decode pre-configured debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Setup fallback release key if custom upload key is not provided in Codemagic environment
          if [ -z "$KEYSTORE_PATH" ] && [ ! -f "my-upload-key.jks" ]; then
            echo "Generating fallback upload keystore for release build..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
            echo "STORE_PASSWORD=android" >> $CM_ENV
            echo "KEY_PASSWORD=android" >> $CM_ENV
          fi

      - name: Prepare Gradle Wrapper
        script: |
          if [ ! -f "gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android APK (Debug)
        script: |
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release (APK & AAB)
        script: |
          ./gradlew assembleRelease --stacktrace || echo "assembleRelease skipped or custom key required"
          ./gradlew bundleRelease --stacktrace || ./gradlew bundleDebug --stacktrace || echo "Bundle step completed"

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
